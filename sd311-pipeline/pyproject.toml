[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd311"
version = "0.1.0"
description = "San Diego Get It Done (311) pipeline: AWS ingest + monitoring (sd311) and the closure-time model (sd311_core)"
requires-python = ">=3.11"
# Runtime deps (also what docker/requirements.txt installs in the Lambda image).
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "pyarrow>=15",
  "pandera>=0.24",  # 0.24+ provides `import pandera.pandas`
  "boto3>=1.34",
]

[project.optional-dependencies]
# Model code (sd311_core) and the Databricks ML tasks.
ml = [
  "catboost==1.2.10",
  "scikit-learn>=1.4",
  "mlflow>=2.16",
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8",
  "moto[s3,ssm,cloudwatch]>=5",
  "responses>=0.25",
  "ruff>=0.5",
  "python-hcl2>=4",   # lesson 5 checker (parses infra/*.tf)
  "dbt-duckdb>=1.8",   # lesson 7 checker + local warehouse build
  "pyyaml>=6",         # lesson 9 checker (parses ci.yml)
]

# Two import roots, one install: `pip install -e .` exposes
#   sd311       from src/sd311   (AWS ingest + monitor)
#   sd311_core  from ml/sd311_core (model code, also used by databricks/tasks)
# `include` keeps ml/tests, ml/analysis etc. out of the wheel.
[tool.setuptools.packages.find]
where = ["src", "ml"]
include = ["sd311", "sd311.*", "sd311_core", "sd311_core.*"]

[tool.pytest.ini_options]
# One run covers all three suites. `ml` is on the path for `analysis` and `scripts`;
# sd311_core itself comes from the editable install (or this path entry).
pythonpath = ["src", ".", "ml"]
testpaths = ["tests", "ml/tests", "databricks/tests"]
addopts = "-q"
markers = [
  "lesson1: checks the code you write in lesson 1 (python scripts/lessons.py check 1)",
  "lesson2: checks the code you write in lesson 2 (python scripts/lessons.py check 2)",
  "lesson3: checks the code you write in lesson 3 (python scripts/lessons.py check 3)",
  "lesson4: checks the code you write in lesson 4 (python scripts/lessons.py check 4)",
  "lesson5: checks the code you write in lesson 5 (python scripts/lessons.py check 5)",
  "lesson6: checks the code you write in lesson 6 (python scripts/lessons.py check 6)",
  "lesson7: checks the code you write in lesson 7 (python scripts/lessons.py check 7)",
  "lesson8: checks the code you write in lesson 8 (python scripts/lessons.py check 8)",
  "lesson9: checks the code you write in lesson 9 (python scripts/lessons.py check 9)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["databricks", "dbt", "ml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
