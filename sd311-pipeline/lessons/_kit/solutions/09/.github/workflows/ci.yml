# CI: runs on every pull request and every push. Nothing here needs AWS or
# Databricks credentials -- it only proves the code, image and IaC are sane.
# The four jobs are independent, so GitHub runs them in parallel.
name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the Lambda base image
          cache: pip

      # pyspark (databricks/tests SQL-parser checks) needs Java 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # python-hcl2 parses infra/*.tf for the IAM checks; dbt-duckdb lets the
      # dbt model tests (tests/integration/test_dbt_models.py) run here too.
      - name: Install (AWS package, model package, ML extras, test tools)
        run: |
          pip install -e ".[dev,ml]"
          pip install -r databricks/requirements-dev.txt
          pip install python-hcl2 dbt-duckdb

      - name: Lint (ruff)
        run: ruff check .

      # One run: tests/ (AWS + infra + dbt models), ml/tests, databricks/tests.
      # Testpaths live in pyproject.toml. A test that reaches an unfinished
      # lesson stub is reported as SKIPPED (see conftest.py), not failed.
      # The file-store registry test needs this opt-in on MLflow 3.x (also set in the test).
      - name: Tests (pytest)
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lambda image (no push)
        run: docker build -f docker/Dockerfile -t sd311-lambda:ci .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend, no credentials needed)
        run: terraform init -backend=false
      - name: validate
        run: terraform validate

  dbt:
    # Builds every model and runs every data test on the committed 1% fixtures
    # (dbt/fixtures/bronze) with DuckDB: no warehouse, no credentials.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt-duckdb
        run: pip install dbt-duckdb
      - name: dbt parse + build (duckdb target)
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt parse --target duckdb
          dbt build --target duckdb
